<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ClickType icon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ctBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3448"/>
      <stop offset="1" stop-color="#151924"/>
    </linearGradient>
    <linearGradient id="ctKeyTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E7EE"/>
    </linearGradient>
    <linearGradient id="ctKeySide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9CED9"/>
      <stop offset="1" stop-color="#A7AEBD"/>
    </linearGradient>
    <filter id="ctShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="ctSoft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle body (macOS 824px grid) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ctBody)" filter="url(#ctShadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="3"/>

  <!-- Keycap -->
  <g filter="url(#ctSoft)">
    <rect x="252" y="262" width="460" height="470" rx="84" fill="url(#ctKeySide)"/>
    <rect x="286" y="276" width="392" height="382" rx="62" fill="url(#ctKeyTop)"/>
  </g>

  <!-- "T" glyph + text caret -->
  <rect x="360" y="340" width="150" height="42" rx="12" fill="#1B1F2B"/>
  <rect x="414" y="340" width="42" height="184" rx="12" fill="#1B1F2B"/>
  <rect x="530" y="326" width="18" height="206" rx="9" fill="#FF9F43"/>

  <!-- Click lines -->
  <g stroke="#FF9F43" stroke-width="18" stroke-linecap="round">
    <line x1="624" y1="548" x2="624" y2="502"/>
    <line x1="594" y1="562" x2="566" y2="534"/>
    <line x1="582" y1="594" x2="538" y2="594"/>
  </g>

  <!-- Pointer -->
  <g transform="translate(622 592)" filter="url(#ctSoft)">
    <path d="M0 0 L0 252 L62 194 L106 290 L150 270 L106 176 L190 176 Z" fill="#FFFFFF" stroke="#1B1F2B" stroke-width="16" stroke-linejoin="round"/>
  </g>
</svg>
